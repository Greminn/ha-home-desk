name: Validate

# Checks that run on every push and pull request: the panel builds and type-checks, the committed panel bundle
# matches its source, the Python is valid, and Home Assistant's own validators (hassfest) and HACS's are happy.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    name: Panel builds and is up to date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The built panel is committed (Home Assistant loads it straight from the integration), so it must match the source.
      - name: The committed panel bundle matches the source
        working-directory: .
        run: git diff --exit-code -- custom_components/home_desk/www/home-desk-panel.js

  python:
    name: Python is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile everything
        run: python -m compileall -q custom_components mcp tools tests
      - name: Generated service files are up to date
        run: |
          python tools/gen_services.py
          git diff --exit-code -- custom_components/home_desk/services.yaml custom_components/home_desk/strings.json custom_components/home_desk/translations/en.json
      - run: pip install voluptuous aiohttp pyyaml "mcp<2"
      - name: Storage tests (tickets, labels, categories, statuses, the AI agent, settings, repairs)
        run: python -I tests/test_storage.py
      - name: API tests (who may do what over the websocket and the services)
        run: python tests/test_api.py
      - name: MCP bridge tests
        run: python tests/test_mcp.py
      - name: Report tests (photos and voice messages: upload, download, file checks, transcription)
        run: python tests/test_attachments.py
      - name: Matching tests (guessing what a ticket is about)
        run: python -I tests/test_matching.py
      - name: Runner tests
        run: python -I tests/test_runner.py
      - name: AI agent tests (redaction, the context sent, a full turn against a fake AI Task)
        run: python tests/test_agent.py

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
