name: Bug report
description: Something is not working right
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, what you did and what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open '...'
        2. Select '...'
        3. See the error
    validations:
      required: false

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2026.10.1"
    validations:
      required: true

  - type: input
    id: hd-version
    attributes:
      label: Home Desk version
      description: Settings → About in the Home Desk panel.
      placeholder: "e.g. 1.0.0-beta.1"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Browser console errors, Home Assistant logs (Settings → System → Logs), or a screenshot of what you see. Remove anything private first.
      render: shell
    validations:
      required: false
