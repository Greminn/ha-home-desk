get_guide:
  name: "Get guide"
  description: "START HERE if you are an AI agent. Returns the usage guide for Home Desk: what it is, ticket fields and statuses, how to review, comment on, update and close tickets, and conventions to follow."
get_changelog:
  name: "Get changelog"
  description: "Return the installed Home Desk version and its changelog: what changed, and any **Action:** or **Breaking:** notes. Pass `since` (the last version you reviewed) to get only newer releases. Call after Home Desk is updated."
  fields:
    since:
      name: "Since version"
      description: "Only include releases newer than this version. The Unreleased section is always included."
      example: "0.1.0"
      selector: {"text": {}}
list_labels:
  name: "List labels"
  description: "Return every label with its id, name, colour, description and how many tickets use it. Prefer an existing label over inventing a new one; a label name you use that doesn't exist is created automatically. Built-in labels: Bug, Enhancement, Task, Question, History and Blocked. (What part of the home a ticket is about is a category, see list_categories.)"
create_label:
  name: "Create label"
  description: "Create a label, for example Zigbee or Needs review. Check list_labels first so you don't add a near-duplicate. Pass `actor` with your own name."
  fields:
    name:
      name: "Name"
      description: "The label's name."
      required: true
      example: "Zigbee"
      selector: {"text": {}}
    color:
      name: "Colour"
      description: "One of Home Assistant's colour names, e.g. teal. Picked automatically if left out."
      example: "teal"
      selector: {"text": {}}
    description:
      name: "Description"
      description: "What the label means."
      selector: {"text": {}}
    icon:
      name: "Icon"
      description: "An optional icon such as mdi:zigbee."
      selector: {"text": {}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
update_label:
  name: "Update label"
  description: "Rename a label or change its colour, icon or description. Tickets keep the label when it is renamed. The built-in labels (Bug, Enhancement, Task, Question, History, Blocked) can't be changed."
  fields:
    label:
      name: "Label"
      description: "The label's name or id."
      required: true
      example: "Zigbee"
      selector: {"text": {}}
    name:
      name: "New name"
      description: "A new name."
      selector: {"text": {}}
    color:
      name: "Colour"
      description: "A new colour name, e.g. teal."
      selector: {"text": {}}
    description:
      name: "Description"
      description: "A new description."
      selector: {"text": {}}
    icon:
      name: "Icon"
      description: "A new icon such as mdi:zigbee."
      selector: {"text": {}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
delete_label:
  name: "Delete label"
  description: "Delete a label that no ticket uses. A label in use is refused: remove it from those tickets first, or ask the manager to delete it in the panel. The built-in labels can't be deleted."
  fields:
    label:
      name: "Label"
      description: "The label's name or id."
      required: true
      example: "Zigbee"
      selector: {"text": {}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
list_categories:
  name: "List categories"
  description: "Return every category with its id, name, icon and how many tickets use it. A category says what part of the smart home a ticket is about (Home Assistant, Network, Lighting...). A ticket has at most one. Home Assistant is built in."
create_category:
  name: "Create category"
  description: "Create a category, for example Network or Cameras. Check list_categories first. Pass `actor` with your own name."
  fields:
    name:
      name: "Name"
      description: "The category's name."
      required: true
      example: "Network"
      selector: {"text": {}}
    icon:
      name: "Icon"
      description: "An optional icon such as mdi:lan."
      example: "mdi:lan"
      selector: {"text": {}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
update_category:
  name: "Update category"
  description: "Rename a category or change its icon. The built-in Home Assistant category can't be changed."
  fields:
    category:
      name: "Category"
      description: "The category's name or id."
      required: true
      example: "Network"
      selector: {"text": {}}
    name:
      name: "New name"
      description: "A new name."
      selector: {"text": {}}
    icon:
      name: "Icon"
      description: "A new icon such as mdi:lan."
      selector: {"text": {}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
delete_category:
  name: "Delete category"
  description: "Delete a category that no ticket uses. A category in use is refused: move its tickets first, or ask the manager to delete it in the panel. The built-in Home Assistant category can't be deleted."
  fields:
    category:
      name: "Category"
      description: "The category's name or id."
      required: true
      example: "Network"
      selector: {"text": {}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
get_stats:
  name: "Get stats"
  description: "Return ticket counts by status, urgent, unassigned and with-AI-agent counts, how many active tickets have no category, and every label and category (with counts). A good first call to see what needs attention."
list_tickets:
  name: "List tickets"
  description: "List ticket summaries (no bodies); use get_ticket for the full ticket. Defaults to active tickets, excluding those labelled History. Label `needs-review` marks tickets whose state has not been verified yet."
  fields:
    status:
      name: "Status"
      description: "A status, a comma-separated list, `active` (new and in_progress; the default) or `all`."
      example: "active"
      selector: {"text": {}}
    query:
      name: "Query"
      description: "Search text across title, description, comments, resolution, labels and entities."
      selector: {"text": {}}
    priority:
      name: "Priority"
      description: "Only this priority."
      selector: {"select": {"options": ["low", "normal", "high", "urgent"]}}
    assignee:
      name: "Assignee"
      description: "Only this assignee, or `unassigned`."
      selector: {"text": {}}
    requester:
      name: "Requester"
      description: "Only tickets raised by this person."
      selector: {"text": {}}
    label:
      name: "Label"
      description: "Only tickets with this label (name or id), e.g. Bug, Enhancement or Blocked."
      selector: {"text": {}}
    category:
      name: "Category"
      description: "Only tickets in this category (name or id), or `none` for tickets with no category yet."
      selector: {"text": {}}
    include_history:
      name: "Include history"
      description: "Include tickets labelled History (records of past work). Default false."
      selector: {"boolean": {}}
    limit:
      name: "Limit"
      description: "Maximum tickets to return (default 100)."
      selector: {"number": {"min": 1, "max": 1000, "mode": "box"}}
get_ticket:
  name: "Get ticket"
  description: "Return one ticket in full: description, resolution, labels, entities, timeline of comments and changes, and related tickets."
  fields:
    ticket_id:
      name: "Ticket ID"
      description: "The ticket's number."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
create_ticket:
  name: "Create ticket"
  description: "Create a ticket and return it. Search first (list_tickets with a query) to avoid duplicates. AI agents: call get_guide first and pass `actor` with your own name."
  fields:
    title:
      name: "Title"
      description: "Short summary of the problem, request or idea."
      required: true
      example: "Hallway light didn't turn on"
      selector: {"text": {}}
    description:
      name: "Description"
      description: "Details in markdown: what happened, evidence, what was expected."
      selector: {"text": {"multiline": true}}
    priority:
      name: "Priority"
      description: "low, normal, high or urgent (urgent = safety, security or whole-house outage)."
      selector: {"select": {"options": ["low", "normal", "high", "urgent"]}}
    requester:
      name: "Requester"
      description: "Who raised it. Defaults to the actor."
      selector: {"text": {}}
    assignee:
      name: "Assignee"
      description: "Who is working on it. Leave empty for unassigned. Assigning a ticket to an AI agent (name starting `ai:`) hands it to that agent; a `home_desk_event` of kind `assigned` is fired."
      selector: {"text": {}}
    labels:
      name: "Labels"
      description: "Label names or ids, e.g. Bug, Enhancement, Task, Question. Names that don't exist yet are created."
      selector: {"text": {"multiple": true}}
    category:
      name: "Category"
      description: "What part of the home this is about (see list_categories), e.g. Network. It must already exist: create_category first if it is new. Leave empty if unsure."
      selector: {"text": {}}
    entities:
      name: "Entities"
      description: "Home Assistant entity ids this ticket concerns."
      selector: {"text": {"multiple": true}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
update_ticket:
  name: "Update ticket"
  description: "Change a ticket's fields. Pass only what should change; every change is logged on the timeline. To close a ticket use close_ticket so a resolution is recorded."
  fields:
    ticket_id:
      name: "Ticket ID"
      description: "The ticket's number."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
    title:
      name: "Title"
      description: "New title."
      selector: {"text": {}}
    description:
      name: "Description"
      description: "New description (markdown)."
      selector: {"text": {"multiline": true}}
    status:
      name: "Status"
      description: "new, in_progress, resolved or closed. A ticket moves from new to in_progress by itself the first time anyone acts on it, and a resolved ticket closes by itself after the delay in Settings, so you rarely need this. To mark a ticket as waiting on something, add the Blocked label. (`open` is accepted and means in_progress.)"
      selector: {"select": {"options": ["new", "in_progress", "resolved", "closed"]}}
    priority:
      name: "Priority"
      description: "New priority."
      selector: {"select": {"options": ["low", "normal", "high", "urgent"]}}
    assignee:
      name: "Assignee"
      description: "New assignee; empty to unassign. When an AI agent a ticket is assigned to comments on it, the ticket is handed back (the assignee is cleared) automatically."
      selector: {"text": {}}
    labels:
      name: "Labels"
      description: "Replace all labels with this list."
      selector: {"text": {"multiple": true}}
    category:
      name: "Category"
      description: "Move the ticket to this category (name or id, from list_categories); empty to clear."
      selector: {"text": {}}
    add_labels:
      name: "Add labels"
      description: "Label names or ids to add. Unknown names are created."
      selector: {"text": {"multiple": true}}
    remove_labels:
      name: "Remove labels"
      description: "Label names or ids to remove."
      selector: {"text": {"multiple": true}}
    entities:
      name: "Entities"
      description: "Replace the linked entity ids."
      selector: {"text": {"multiple": true}}
    resolution:
      name: "Resolution"
      description: "Resolution notes."
      selector: {"text": {"multiline": true}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
add_comment:
  name: "Add comment"
  description: "Add a comment to a ticket's timeline. Use it to record findings: what you checked, what you found, with times and values."
  fields:
    ticket_id:
      name: "Ticket ID"
      description: "The ticket's number."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
    body:
      name: "Comment"
      description: "The comment, in markdown."
      required: true
      selector: {"text": {"multiline": true}}
    internal:
      name: "Internal note"
      description: "True makes a private note that the requester can't see."
      selector: {"boolean": {}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
close_ticket:
  name: "Close ticket"
  description: "Resolve or close a ticket with resolution notes (the cause and the fix). Only close when you are confident; otherwise comment and leave it open."
  fields:
    ticket_id:
      name: "Ticket ID"
      description: "The ticket's number."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
    resolution:
      name: "Resolution"
      description: "What the cause was and what fixed it."
      required: true
      selector: {"text": {"multiline": true}}
    status:
      name: "Status"
      description: "`resolved` (fixed; the default) or `closed` (won't fix, superseded or no longer relevant)."
      selector: {"select": {"options": ["resolved", "closed"]}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
link_tickets:
  name: "Link tickets"
  description: "Mark two tickets as related; shown on both."
  fields:
    ticket_id:
      name: "Ticket ID"
      description: "One ticket."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
    other_id:
      name: "Other ticket ID"
      description: "The related ticket."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
merge_tickets:
  name: "Merge tickets"
  description: "Fold duplicate tickets into one. `ticket_id` is the ticket to keep; the tickets in `merge_ids` have their comments, description, labels, files and linked repairs moved onto it and are closed as merged. Do this for tickets that are really the same problem; it can't be undone."
  fields:
    ticket_id:
      name: "Ticket to keep"
      description: "The ticket the others are merged into."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
    merge_ids:
      name: "Tickets to merge"
      description: "Numbers of the tickets to fold in, e.g. [12, 15]."
      required: true
      example: [12, 15]
      selector: {"object": {}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
import_file:
  name: "Import file"
  description: "Admin: bulk-import tickets from a JSON file inside the config directory. Idempotent: tickets whose source_key already exists are skipped."
  fields:
    path:
      name: "Path"
      description: "Path to the JSON file, inside the Home Assistant config directory."
      required: true
      example: "/config/home_desk_import.json"
      selector: {"text": {}}
    actor:
      name: "Actor"
      description: "Who is importing."
      selector: {"text": {}}
