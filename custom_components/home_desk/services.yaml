get_guide:
  name: "Get guide"
  description: "START HERE if you are an AI agent. Returns the usage guide for Home Desk: what it is, ticket fields and statuses, how to review, comment on, update and close tickets, and conventions to follow."
get_changelog:
  name: "Get changelog"
  description: "Return the installed Home Desk version and its changelog: what changed, and any **Action:** or **Breaking:** notes. Pass `since` (the last version you reviewed) to get only newer releases. Call after Home Desk is updated."
  fields:
    since:
      name: "Since version"
      description: "Only include releases newer than this version. The Unreleased section is always included."
      example: "0.1.0"
      selector: {"text": {}}
list_labels:
  name: "List labels"
  description: "Return every label with its id, name, colour, description and how many tickets use it. Prefer an existing label over inventing a new one; a label name you use that doesn't exist is created automatically. Built-in labels: Bug, Enhancement, Task, Question, History, Blocked and Home Assistant."
get_stats:
  name: "Get stats"
  description: "Return ticket counts by status, urgent and unassigned counts, and every label (with colour and count). A good first call to see what needs attention."
list_tickets:
  name: "List tickets"
  description: "List ticket summaries (no bodies); use get_ticket for the full ticket. Defaults to active tickets, excluding those labelled History. Label `needs-review` marks tickets whose state has not been verified yet."
  fields:
    status:
      name: "Status"
      description: "A status, a comma-separated list, `active` (new, open, in_progress; the default) or `all`."
      example: "active"
      selector: {"text": {}}
    query:
      name: "Query"
      description: "Search text across title, description, comments, resolution, labels and entities."
      selector: {"text": {}}
    priority:
      name: "Priority"
      description: "Only this priority."
      selector: {"select": {"options": ["low", "normal", "high", "urgent"]}}
    assignee:
      name: "Assignee"
      description: "Only this assignee, or `unassigned`."
      selector: {"text": {}}
    requester:
      name: "Requester"
      description: "Only tickets raised by this person."
      selector: {"text": {}}
    label:
      name: "Label"
      description: "Only tickets with this label (name or id), e.g. Bug, Enhancement or Blocked."
      selector: {"text": {}}
    include_history:
      name: "Include history"
      description: "Include tickets labelled History (records of past work). Default false."
      selector: {"boolean": {}}
    limit:
      name: "Limit"
      description: "Maximum tickets to return (default 100)."
      selector: {"number": {"min": 1, "max": 1000, "mode": "box"}}
get_ticket:
  name: "Get ticket"
  description: "Return one ticket in full: description, resolution, labels, entities, timeline of comments and changes, and related tickets."
  fields:
    ticket_id:
      name: "Ticket ID"
      description: "The ticket's number."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
create_ticket:
  name: "Create ticket"
  description: "Create a ticket and return it. Search first (list_tickets with a query) to avoid duplicates. AI agents: call get_guide first and pass `actor` with your own name."
  fields:
    title:
      name: "Title"
      description: "Short summary of the problem, request or idea."
      required: true
      example: "Hallway light didn't turn on"
      selector: {"text": {}}
    description:
      name: "Description"
      description: "Details in markdown: what happened, evidence, what was expected."
      selector: {"text": {"multiline": true}}
    priority:
      name: "Priority"
      description: "low, normal, high or urgent (urgent = safety, security or whole-house outage)."
      selector: {"select": {"options": ["low", "normal", "high", "urgent"]}}
    requester:
      name: "Requester"
      description: "Who raised it. Defaults to the actor."
      selector: {"text": {}}
    assignee:
      name: "Assignee"
      description: "Who should work on it. Leave empty for unassigned."
      selector: {"text": {}}
    labels:
      name: "Labels"
      description: "Label names or ids, e.g. Bug, Enhancement, Task, Question. Names that don't exist yet are created. Defaults to Home Assistant when omitted."
      selector: {"text": {"multiple": true}}
    entities:
      name: "Entities"
      description: "Home Assistant entity ids this ticket concerns."
      selector: {"text": {"multiple": true}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
update_ticket:
  name: "Update ticket"
  description: "Change a ticket's fields. Pass only what should change; every change is logged on the timeline. To close a ticket use close_ticket so a resolution is recorded."
  fields:
    ticket_id:
      name: "Ticket ID"
      description: "The ticket's number."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
    title:
      name: "Title"
      description: "New title."
      selector: {"text": {}}
    description:
      name: "Description"
      description: "New description (markdown)."
      selector: {"text": {"multiline": true}}
    status:
      name: "Status"
      description: "new, open, in_progress, resolved or closed. To mark a ticket as waiting on something, add the Blocked label."
      selector: {"select": {"options": ["new", "open", "in_progress", "resolved", "closed"]}}
    priority:
      name: "Priority"
      description: "New priority."
      selector: {"select": {"options": ["low", "normal", "high", "urgent"]}}
    assignee:
      name: "Assignee"
      description: "New assignee; empty to unassign."
      selector: {"text": {}}
    labels:
      name: "Labels"
      description: "Replace all labels with this list."
      selector: {"text": {"multiple": true}}
    add_labels:
      name: "Add labels"
      description: "Label names or ids to add. Unknown names are created."
      selector: {"text": {"multiple": true}}
    remove_labels:
      name: "Remove labels"
      description: "Label names or ids to remove."
      selector: {"text": {"multiple": true}}
    entities:
      name: "Entities"
      description: "Replace the linked entity ids."
      selector: {"text": {"multiple": true}}
    resolution:
      name: "Resolution"
      description: "Resolution notes."
      selector: {"text": {"multiline": true}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
add_comment:
  name: "Add comment"
  description: "Add a comment to a ticket's timeline. Use it to record findings: what you checked, what you found, with times and values."
  fields:
    ticket_id:
      name: "Ticket ID"
      description: "The ticket's number."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
    body:
      name: "Comment"
      description: "The comment, in markdown."
      required: true
      selector: {"text": {"multiline": true}}
    internal:
      name: "Internal note"
      description: "True makes a private note that the requester can't see."
      selector: {"boolean": {}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
close_ticket:
  name: "Close ticket"
  description: "Resolve or close a ticket with resolution notes (the cause and the fix). Only close when you are confident; otherwise comment and leave it open."
  fields:
    ticket_id:
      name: "Ticket ID"
      description: "The ticket's number."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
    resolution:
      name: "Resolution"
      description: "What the cause was and what fixed it."
      required: true
      selector: {"text": {"multiline": true}}
    status:
      name: "Status"
      description: "`resolved` (fixed; the default) or `closed` (won't fix, superseded or no longer relevant)."
      selector: {"select": {"options": ["resolved", "closed"]}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
link_tickets:
  name: "Link tickets"
  description: "Mark two tickets as related; shown on both."
  fields:
    ticket_id:
      name: "Ticket ID"
      description: "One ticket."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
    other_id:
      name: "Other ticket ID"
      description: "The related ticket."
      required: true
      selector: {"number": {"min": 1, "mode": "box"}}
    actor:
      name: "Actor"
      description: "Who is acting, recorded on the timeline. AI agents: pass your own name (e.g. claude), otherwise the token owner's name is recorded."
      selector: {"text": {}}
import_file:
  name: "Import file"
  description: "Admin: bulk-import tickets from a JSON file inside the config directory. Idempotent: tickets whose source_key already exists are skipped."
  fields:
    path:
      name: "Path"
      description: "Path to the JSON file, inside the Home Assistant config directory."
      required: true
      example: "/config/home_desk_import.json"
      selector: {"text": {}}
    actor:
      name: "Actor"
      description: "Who is importing."
      selector: {"text": {}}
